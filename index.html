<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./reset.css">
    <title>Shooting Game</title>
  </head>

  <body>
    <main>
      <div id="modalDiv">
        <div class="fixed text-white text-sm ml-2 mt-1 select-none" id="score-container">
          <span>Score: </span><span id="scoreEl">0</span>
        </div>
        <div class="fixed inset-0 flex items-center justify-center text-center" id="modalEl">
          <div class="titleDiv bg-white max-w-md w-full p-6">
            <h1 class="text-4xl font-bold leading-none" id="bigScoreEl">0</h1>
            <p class="text-sm text-gray-700 mb-4">Points</p>
          </div>
          <div class="bg-white max-w-md w-full p-6">
            <button class="bg-blue-500 text-white w-full py-3 rounded-full text-sm" id="startGameBtn">
              Start Game
            </button>
          </div>
        </div>
      </div>
      <canvas id="container">

      </canvas>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
    <script type="module" src="./script.js"></script>

  </body>

</html>
